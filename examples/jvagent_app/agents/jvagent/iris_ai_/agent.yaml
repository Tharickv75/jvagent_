# Example Agent Configuration
# This file defines the agent's metadata, configuration, and action assignments

# Agent reference in namespace/agent_name format
agent: jvagent/iris_ai

# Agent metadata
version: 1.0.0
author: V75 Inc.

# jvagent version requirement (optional)
jvagent: ~0.0.1

# Agent context: Properties that configure the agent
context:
  alias: IRIS AI
  description: IRIS is a witty citizen-companion AI with knowledge about Guyana.
  enabled: true

# Action Assignments
# Actions are discovered from:
# 1. Local actions: actions/{namespace}/{action_name}/ (takes precedence)
# 2. Core actions: jvagent library (jvagent/action/*/) if not found locally
# Actions are referenced using the format: namespace/action_name

actions:
  # InteractRouter Action - Intent-based routing for InteractActions
  # Core action from jvagent library (jvagent/action/router/)
  - action: jvagent/interact_router
    context:
      enabled: true
      description: "Intent-based routing action that analyzes utterances and routes to appropriate InteractActions"
      # Model Configuration (uses OpenAI model action by entity type)
      model_action_type: "OpenAILanguageModelAction"  # Entity type to find dynamically
      history_limit: 3  # Number of previous interactions to include in context
      # Optional: List of InteractAction entity names that must always execute.
      # When using the InteractAction.always_execute flag, exceptions can be
      # managed declaratively in code instead of being listed here.

  # OpenAI Embedding Model Action - Vector embeddings for semantic search
  # Core action from jvagent library (jvagent/action/model/embedding/openai/)
  - action: jvagent/openai_embedding
    context:
      enabled: true
      description: "OpenAI embeddings API for generating vector embeddings"
      # API Configuration
      api_key: ${OPENAI_API_KEY}  # Set in .env or environment
      api_endpoint: "https://api.openai.com/v1"
      # Model Configuration
      model: text-embedding-3-small  # Default embedding model
      embedding_dimensions: 1536  # Expected dimensions (0 = auto-detect)
      timeout: 30

  - action: jvagent/intro_interact_action
    context:
      enabled: true
      description: "Introductory interact action for first-time users"

  # TypesenseVectorStore Action - Vector store for semantic search
  # Core action from jvagent library (jvagent/action/vectorstore/typesense/)
  - action: jvagent/typesense_vectorstore
    context:
      enabled: true
      description: "Typesense vector store for semantic search and context retrieval"
      # Typesense Configuration
      host: localhost
      port: 8108
      protocol: http
      api_key: ${TYPESENSE_API_KEY}  # Set in .env or environment
      connection_timeout_seconds: 2
      embedding_dimensions: 1536  # Must match embedding model dimensions
      # Embedding Model Configuration
      embedding_model_action_type: "OpenAIEmbeddingModelAction"  # Entity type to find dynamically

  # RetrievalInteractAction - Context retrieval from vector stores
  # Core action from jvagent library (jvagent/action/retrieval/)
  - action: jvagent/retrieval_interact_action
    context:
      enabled: true
      description: "Retrieves context from vector stores and adds directives for PersonaAction"
      # VectorStore Configuration
      vectorstore_action_type: "TypesenseVectorStore"  # Entity type to find dynamically
      k: 5  # Number of search results to retrieve
      weight: -75  # Runs after InteractRouter but before other Interact Actions
      anchors:
        - "User requests information from knowledge base"
        - "User asks a question requiring search"
        - "User wants to find information"
      # Optional: Minimum similarity score threshold (0.0-1.0)
      # min_score_threshold: 0.7
      # Optional: Customize directive template (default shown for reference)
      directive: |
        Context retrieved from knowledge base:
        {results}
        Use this context to inform your response to the user's query.
      collection: "n.Agent.478ee040eb98491c8426c975"

  - action: jvagent/news_interact_action
    context:
      enabled: true
      description: "Retrieves news articles and creates a summary"
      weight: -50  # Runs after InteractRouter but before other Interact Actions
      use_dspy: false
      anchors:
        - "User requests news articles"
        - "User asks a question requiring news articles"
        - "User wants to know the latest news"

  # OpenAI Language Model Action - LLM integration with multimodal support
  # Core action from jvagent library (jvagent/action/model/language/openai/)
  - action: jvagent/openai_lm
    context:
      enabled: true
      description: "OpenAI GPT-4o model action with vision support"
      # API Configuration
      api_key: ${OPENAI_API_KEY}  # Set in .env or environment
      api_endpoint: "https://api.openai.com/v1"
      # Model Configuration
      model: gpt-4o-mini  # Default model for queries
      temperature: 0.2
      max_tokens: 4096
      timeout: 60

  # Persona Action - Core interact action for agent behavioral modeling
  # Core action from jvagent library (jvagent/action/persona/)
  - action: jvagent/persona
    context:
      enabled: true
      description: "Persona action with LLM-driven behavioral parameters"
      # Persona Identity
      persona_name: "IRIS AI"
      persona_description: |
        You are witty, engaging yet professional and always eager to assist users with their inquiries about Guyana. Your bubbly personality, makes interactions enjoyable and memorable.
        You love starting new topics of conversation and are skilled at keeping users engaged with interesting facts and stories about Guyana when appropriate.
      persona_capabilities:
        - "Answer questions about Guyana"
        - "Can share daily news summaries"
      model_action_type: "OpenAILanguageModelAction"  # Entity type to find dynamically
      model: "gpt-4o-mini"
      model_temperature: 0.1
      model_max_tokens: 8192
      use_dspy: false

  - action: jvagent/whatsapp
    context:
      enabled: true
      description: "WhatsApp provider (wppconnect, ultramsg, wwebjs)"
      # whatsapp configuration
      provider: "wwebjs"
      api_url: "http://localhost:21003"
      api_key: "THISISMYSECURETOKEN"
      session: Iris
      base_url: "https://501891124a68.ngrok-free.app"

  # Service Directory Action - Search for services using vector store
  # Located at: jvagent/action/services_router/service_directory_interact_action.py
  # - action: jvagent/service_directory_interact_action
  #   context:
  #     enabled: true
  #     description: "Directory assistant that finds and connects users to services using vector search."
  #     weight: -20  # Priority routing (check directory before small talk)
  #     vectorstore_action_type: "TypesenseVectorStore"
  #     collection: "service_directory"
  #     k: 100
  #     min_score_threshold: 0.4
  #     # Anchors are defined in the class, but can be overridden here
  #     anchors:
  #       - "Find a service"
  #       - "I need help finding something"
  #       - "Directory assistance"
  #       - "Show me available services"
  #       - "Find a hotel"
  #       - "Where can I get food?"
  #       - "Look up a service"

  - action: jvagent/converse_interact_action
    context:
      enabled: true
      description: "Fallback action for smalltalk and casual conversation"
      weight: 100  # Runs last as a safety net
